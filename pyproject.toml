[project]
name = "recruitment-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RVS", email = "teja-rvs@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "anyio<4.15",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "faker>=40.38.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "httpx2>=2.12.0",
    "phonenumbers>=9.0.38",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "ruff>=0.16.6",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
recruitment-fastapi = "recruitment_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
strict = true
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "unit: tests that do not use the database or HTTP stack",
    "integration: tests that use the database or HTTP stack",
]

[tool.coverage.run]
source = ["src/recruitment_fastapi"]
omit = [
    "src/recruitment_fastapi/alembic/*",
    "src/recruitment_fastapi/__init__.py",
]

[tool.coverage.report]
fail_under = 90.0
show_missing= true

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.fastapi]
entrypoint = "recruitment_fastapi.main:app"

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
extend-select = ["FAST"]

[tool.ruff.lint.isort]
known-first-party = ["recruitment_fastapi", "tests"]
